name: Bug report
description: Report a reproducible problem in AuraPro Desktop.
title: '[Bug]: '
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include passwords, access tokens, private documents, or personal data.
        Security vulnerabilities must be reported according to SECURITY.md.
  - type: input
    id: version
    attributes:
      label: AuraPro version
      placeholder: '3.9.4'
    validations:
      required: true
  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - Windows 10
        - Windows 11
        - macOS
        - Linux
    validations:
      required: true
  - type: dropdown
    id: architecture
    attributes:
      label: Architecture
      options:
        - x64
        - ARM64
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Problem description
      description: Explain what happened and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove credentials and private data before attaching logs.
      render: shell
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add screenshots, hardware details, or other useful information.
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmation
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I removed credentials and private information from this report.
          required: true
